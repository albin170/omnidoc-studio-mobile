name: Release Android Production APK & AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-release-android:
    name: Quality Gates, Signed Build & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag & validate version match
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG (expected vX.Y.Z or vX.Y.Z-beta.1)"
            exit 1
          fi
          VERSION="${TAG#v}"
          VERSION_CORE="${VERSION%%-*}"
          PKG_VER=$(node -p "require('./package.json').version")
          GRADLE_VER=$(grep -E 'versionName "' android/app/build.gradle | head -n1 | sed -E 's/.*versionName "([^"]+)".*/\1/')
          GRADLE_CODE=$(grep -E 'versionCode [0-9]+' android/app/build.gradle | head -n1 | sed -E 's/.*versionCode ([0-9]+).*/\1/')
          if [ "$PKG_VER" != "$VERSION_CORE" ] || [ "$GRADLE_VER" != "$VERSION_CORE" ]; then
            echo "Version mismatch: tag=$VERSION_CORE package.json=$PKG_VER build.gradle=$GRADLE_VER"
            exit 1
          fi
          CHANNEL="stable"
          PRERELEASE="false"
          if [[ "$TAG" == *"-"* ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_CORE" >> "$GITHUB_OUTPUT"
          echo "version_code=$GRADLE_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify required Android signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.OMNIDOC_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.OMNIDOC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNIDOC_KEY_ALIAS }}
          KEY_PW: ${{ secrets.OMNIDOC_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Missing required Android signing secrets (OMNIDOC_KEYSTORE_BASE64, OMNIDOC_KEYSTORE_PASSWORD, OMNIDOC_KEY_ALIAS, OMNIDOC_KEY_PASSWORD). Refusing to publish unsigned release artifacts."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run quality gates & Capacitor sync
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm audit --omit=dev
          npm run build
          npx cap sync android

      - name: Decode upload keystore to runner temp
        env:
          KEYSTORE_B64: ${{ secrets.OMNIDOC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/omnidoc-release.jks"
          chmod 600 "${RUNNER_TEMP}/omnidoc-release.jks"

      - name: Build tested, signed R8 release APK & AAB
        working-directory: android
        env:
          OMNIDOC_KEYSTORE_FILE: ${{ runner.temp }}/omnidoc-release.jks
          OMNIDOC_KEYSTORE_PASSWORD: ${{ secrets.OMNIDOC_KEYSTORE_PASSWORD }}
          OMNIDOC_KEY_ALIAS: ${{ secrets.OMNIDOC_KEY_ALIAS }}
          OMNIDOC_KEY_PASSWORD: ${{ secrets.OMNIDOC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease

      - name: Verify APK/AAB signatures and generate checksums & manifest
        id: package
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          VERSION_CODE="${{ steps.meta.outputs.version_code }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          OUT_DIR="release-artifacts/${TAG}"
          mkdir -p "$OUT_DIR"

          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="android/app/build/outputs/bundle/release/app-release.aab"
          APK_OUT="${OUT_DIR}/omnidoc-studio-${TAG}.apk"
          AAB_OUT="${OUT_DIR}/omnidoc-studio-${TAG}.aab"
          cp "$APK_SRC" "$APK_OUT"
          cp "$AAB_SRC" "$AAB_OUT"

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_OUT" | tee "${OUT_DIR}/apksigner-verify.txt"
          jarsigner -verify "$AAB_OUT"

          CERT_SHA256=$(grep -E "Signer #1 certificate SHA-256 digest:" "${OUT_DIR}/apksigner-verify.txt" | awk -F': ' '{print $2}' | tr -d '[:space:]')
          APK_SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          AAB_SHA256=$(sha256sum "$AAB_OUT" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK_OUT")
          AAB_SIZE=$(stat -c%s "$AAB_OUT")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          (cd "$OUT_DIR" && sha256sum "omnidoc-studio-${TAG}.apk" "omnidoc-studio-${TAG}.aab" > SHA256SUMS.txt)

          node -e '
            const fs = require("fs");
            const manifest = {
              appId: "studio.omnidoc.mobile",
              platform: "android",
              channel: process.env.CHANNEL,
              tag: process.env.TAG,
              version: process.env.VERSION,
              versionCode: Number(process.env.VERSION_CODE),
              releaseDate: process.env.RELEASE_DATE,
              minAndroidVersion: "Android 6.0+ (API 23)",
              targetSdkVersion: 35,
              signingCertificateSha256: process.env.CERT_SHA256,
              apk: {
                filename: `omnidoc-studio-${process.env.TAG}.apk`,
                sizeBytes: Number(process.env.APK_SIZE),
                sha256: process.env.APK_SHA256
              },
              aab: {
                filename: `omnidoc-studio-${process.env.TAG}.aab`,
                sizeBytes: Number(process.env.AAB_SIZE),
                sha256: process.env.AAB_SHA256
              }
            };
            fs.writeFileSync(process.env.MANIFEST_PATH, JSON.stringify(manifest, null, 2) + "\n");
          ' \
          TAG="$TAG" VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" CHANNEL="$CHANNEL" \
          RELEASE_DATE="$RELEASE_DATE" CERT_SHA256="$CERT_SHA256" \
          APK_SIZE="$APK_SIZE" APK_SHA256="$APK_SHA256" \
          AAB_SIZE="$AAB_SIZE" AAB_SHA256="$AAB_SHA256" \
          MANIFEST_PATH="${OUT_DIR}/release-manifest.json"

      - name: Publish GitHub Release with signed artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: OmniDoc Studio Mobile ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/${{ steps.meta.outputs.tag }}/omnidoc-studio-${{ steps.meta.outputs.tag }}.apk
            release-artifacts/${{ steps.meta.outputs.tag }}/omnidoc-studio-${{ steps.meta.outputs.tag }}.aab
            release-artifacts/${{ steps.meta.outputs.tag }}/SHA256SUMS.txt
            release-artifacts/${{ steps.meta.outputs.tag }}/release-manifest.json

      - name: Post-release asset reachability check
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          curl -fsIL "${BASE}/omnidoc-studio-${TAG}.apk"
          curl -fsIL "${BASE}/SHA256SUMS.txt"
          curl -fsIL "${BASE}/release-manifest.json"

      - name: Notify Download Center repository to refresh metadata
        if: ${{ env.HAS_DISPATCH_TOKEN == 'true' }}
        env:
          HAS_DISPATCH_TOKEN: ${{ secrets.DOWNLOAD_CENTER_DISPATCH_TOKEN != '' }}
          DISPATCH_TOKEN: ${{ secrets.DOWNLOAD_CENTER_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            "https://api.github.com/repos/albin170/omnidoc-download-center/dispatches" \
            -d "{\"event_type\":\"mobile-release-published\",\"client_payload\":{\"tag\":\"${{ steps.meta.outputs.tag }}\"}}"

      - name: Always wipe temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/omnidoc-release.jks"
