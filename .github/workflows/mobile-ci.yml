name: OmniDoc Studio Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-and-security:
    name: Frontend Typecheck, Lint, Tests, Build & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest suite
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Production dependency security audit
        run: npm audit --omit=dev

  postgres-and-storage-integration:
    name: Backend PostgreSQL 16 & Storage Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnidoc
          POSTGRES_PASSWORD: omnidoc_ci_password
          POSTGRES_DB: omnidoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4
        with:
          path: mobile

      - name: Checkout OmniDoc web/backend repository
        uses: actions/checkout@v4
        with:
          repository: albin170/omnidoc-studio
          path: backend-repo

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend-repo/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL & Storage integration suite
        working-directory: backend-repo/backend
        env:
          ENVIRONMENT: testing
          TEST_DATABASE_URL: postgresql+asyncpg://omnidoc:omnidoc_ci_password@localhost:5432/omnidoc_test
        run: |
          pytest tests/test_postgres_and_storage_integration.py tests/test_ai_consent_and_mobile_code.py tests/test_supabase_storage.py -v
