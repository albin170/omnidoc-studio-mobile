name: Android Build & Instrumented Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-compile-and-unit-test:
    name: Gradle JVM Unit Tests & Debug/Release Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web bundle and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Run Android JUnit unit tests and build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnidoc-android-debug-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk

  android-emulator-instrumented:
    name: Android Emulator Instrumented Tests (API 34)
    runs-on: macos-14
    needs: android-compile-and-unit-test
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build web bundle and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Run Android instrumented tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          profile: pixel_6
          script: |
            cd android
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest
